<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Game</title>
  </head>
  <body>
    <main class="container">
      <h1 class="title">Добро пожаловать!</h1>
      <p class="subtitle">
        Выберите Камень, Ножницы или Бумагу и начните игру!
      </p>
      <div id="choiceMenu" class="button-group">
        <button id="rock" class="btn">Камень</button>
        <button id="scissors" class="btn">Ножницы</button>
        <button id="paper" class="btn">Бумага</button>
      </div>
      <div id="gameScore" class="score"></div>
      <div id="roundResult" class="result"></div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
